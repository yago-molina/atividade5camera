<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="canva-container">
        <video id="video" autoplay playsinline></video>

        <input type="text" id="nome-aluno" placeholder="Digite seu nome">

        <button id="btn-foto">Tirar foto</button>
        <button id="btn-desligar">Desligar câmera</button>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <div id="perfil-card">
        <h3>Foto de perfil capturada</h3>
        <img id="foto-resultado" src="" alt="Foto capturada">
    </div>

    <script src="script.js"></script>
</body>
</html>
